<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  border-bottom ::after  solid #AED6F1
  /* Selector Class — elemen yang punya class='highlight' */ 
  .highlight 
  { background-color: yellow; 
    font-weight: bold;
  } 
  /* Selector ID — elemen dengan id='hero' */
  #hero 
  { background-color:
     #1A5276;
      color: rgb(10, 10, 10); 
      padding: 40px; 
  } 
  /* Grouping — terapkan gaya yang sama ke h1, h2, h3 */ 
  h1, h2, h3 
  { font-family: 'Georgia', serif;
   color: #3b65da; 
  } 
  /* Pseudo-class — tautan saat di-hover */
   a:hover 
   { color: rgb(238, 0, 0);
   text-decoration: underline;
   }
   h2, h3 
  { font-family: 'Georgia', serif;
   color: #b47cc5; 
  } 

  </style>
</head>
<body>
     <!DOCTYPE html>
<html>
<head>
    <title>Welcome</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        table {
            width: 70%;
            margin: 100px auto;
            border-collapse: separate;
            border-spacing: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        th {
            background: #222;
            color: white;
            padding: 20px;
        }

        td {
            background: white;
            color: #333;
            padding: 25px;
            text-align: center;
            font-size: 20px;
        }

        tr:hover td {
            background: #f1f1f1;
        }
    </style>
</head>

<body>

<table>
    <tr>
        <th><h1>SELAMAT DATANG</h1></th>
    </tr>

    <tr>
        <td><h2>Stria ardiansyah</h2></td>
    </tr>
    <td>saya berasal dari TUBAN,jatim</td>
</table>

</body>
</html>
